<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTest - Authentication Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-dark: #070d1b;
            --card-bg: rgba(17, 24, 39, 0.75);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Live Animated Aurora Background Blobs */
        .aurora-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.35;
            animation: floatBlob 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: #3b82f6;
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #10b981;
            bottom: -15%;
            right: -10%;
            animation-delay: -4s;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: #6366f1;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        .container {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.05);
            position: relative;
            overflow: hidden;
            width: 820px;
            max-width: 92%;
            min-height: 540px;
            margin: 20px;
            z-index: 10;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: linear-gradient(135deg, #2563eb, #1d4ed8, #047857);
            color: #ffffff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        form {
            background: transparent;
            display: flex;
            flex-direction: column;
            padding: 30px 40px;
            height: 100%;
            justify-content: center;
            overflow-y: auto;
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 14px;
        }

        .logo-header i {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
        }

        h2 {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 22px;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
            width: 100%;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            width: 100%;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 13px;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn {
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            padding: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
            filter: brightness(1.05);
        }

        .ghost {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: #FFFFFF;
            margin-top: 15px;
            width: auto;
            padding: 10px 30px;
            box-shadow: none;
        }

        .ghost:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ffffff;
            transform: translateY(-1px);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Live Animated Aurora Background -->
    <div class="aurora-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container" id="mainContainer">
        <!-- SIGN UP FORM -->
        <div class="form-container sign-up-container">
            <form id="registerForm">
                <div class="logo-header">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>EduTest</span>
                </div>
                <h2>Create Account</h2>
                <p class="subtitle">Join the assessment platform</p>
                <div id="regErrorBox" class="error-msg"></div>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="john@college.edu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="regRole" required onchange="toggleFacultyPasscode(this.value)">
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                    </select>
                </div>

                <div class="form-group" id="facultyPasscodeGroup" style="display: none;">
                    <label style="color: var(--warning);">Faculty Secret Passcode</label>
                    <input type="password" id="regPasscode" placeholder="Enter staff passcode">
                </div>

                <button type="submit" class="btn">Register</button>
            </form>
        </div>

        <!-- SIGN IN FORM -->
        <div class="form-container sign-in-container">
            <form id="loginForm">
                <div class="logo-header">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>EduTest</span>
                </div>
                <h2>Sign In</h2>
                <p class="subtitle">Access your portal dashboard</p>
                <div id="loginErrorBox" class="error-msg"></div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="aarav@college.edu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>

        <!-- SLIDING OVERLAY PANEL -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h2>Welcome Back!</h2>
                    <p style="font-size: 14px; margin: 15px 0 20px;">To keep connected with us please login with your personal info</p>
                    <button class="btn ghost" id="signInBtn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h2>Hello, Scholar!</h2>
                    <p style="font-size: 14px; margin: 15px 0 20px;">Enter your personal details and start your online assessment journey</p>
                    <button class="btn ghost" id="signUpBtn">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://edutest-0y0z.onrender.com';
        const container = document.getElementById('mainContainer');

        document.getElementById('signUpBtn').addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        document.getElementById('signInBtn').addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });

        function toggleFacultyPasscode(role) {
            const passcodeGroup = document.getElementById('facultyPasscodeGroup');
            if (role === 'Faculty') {
                passcodeGroup.style.display = 'block';
            } else {
                passcodeGroup.style.display = 'none';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginErrorBox');

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Login failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('name', data.name);
                localStorage.setItem('userId', data.userId);

                window.location.href = data.role === 'Faculty' ? 'faculty.html' : 'student.html';
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const faculty_passcode = document.getElementById('regPasscode').value;
            const errorBox = document.getElementById('regErrorBox');

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role, faculty_passcode })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Registration failed');

                alert('Registration successful! Please sign in.');
                container.classList.remove("right-panel-active");
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
