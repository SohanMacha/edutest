<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTest - Authentication Portal</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 480px;
            margin: 20px;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.right-panel-active .sign-in-container {
            transform: translateX(100%);
        }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        form {
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            padding: 40px;
            height: 100%;
            justify-content: center;
        }

        h2 {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 24px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
            width: 100%;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        input, select {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            width: 100%;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: bold;
            padding: 11px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .ghost {
            background: transparent;
            border-color: #FFFFFF;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            margin-top: 15px;
            width: auto;
            padding: 10px 30px;
        }

        .ghost:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- SIGN UP FORM -->
        <div class="form-container sign-up-container">
            <form id="registerForm">
                <h2>Create Account</h2>
                <p class="subtitle">Join the assessment platform</p>
                <div id="regErrorBox" class="error-msg"></div>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="john@college.edu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="regRole" required>
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                    </select>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
        </div>

        <!-- SIGN IN FORM -->
        <div class="form-container sign-in-container">
            <form id="loginForm">
                <h2>Sign In</h2>
                <p class="subtitle">Access your portal dashboard</p>
                <div id="loginErrorBox" class="error-msg"></div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="aarav@college.edu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>

        <!-- SLIDING OVERLAY PANEL -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h2>Welcome Back!</h2>
                    <p style="font-size: 14px; margin: 15px 0 20px;">To keep connected with us please login with your personal info</p>
                    <button class="btn ghost" id="signInBtn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h2>Hello, Scholar!</h2>
                    <p style="font-size: 14px; margin: 15px 0 20px;">Enter your personal details and start your online assessment journey</p>
                    <button class="btn ghost" id="signUpBtn">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Trailing slash removed to prevent double slashes in fetch routes
        const API_URL = 'https://edutest-0y0z.onrender.com';
        const container = document.getElementById('mainContainer');

        document.getElementById('signUpBtn').addEventListener('click', () => {
            container.classList.add("right-panel-active");
        });

        document.getElementById('signInBtn').addEventListener('click', () => {
            container.classList.remove("right-panel-active");
        });

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginErrorBox');

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Login failed');

                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('name', data.name);
                localStorage.setItem('userId', data.userId);

                window.location.href = data.role === 'Faculty' ? 'faculty.html' : 'student.html';
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            }
        });

        // Handle Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const errorBox = document.getElementById('regErrorBox');

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Registration failed');

                alert('Registration successful! Please sign in.');
                container.classList.remove("right-panel-active");
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
