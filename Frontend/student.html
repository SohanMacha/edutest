<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduTest - Student Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: #1e293b; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    button { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #059669; }
    .test-card { background: #334155; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .question-block { background: #334155; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
    label { display: block; margin: 8px 0; cursor: pointer; }
    .warning-banner { background: #ef4444; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>EduTest Student Portal</h2>
    <div id="warning-banner" class="warning-banner">⚠️ Warning: Tab/Window switch detected! Integrity log updated.</div>

    <div id="tests-section">
      <h3>Available Assessments</h3>
      <div id="tests-list">Loading tests...</div>
    </div>

    <div id="exam-section" class="hidden">
      <h3 id="exam-title">Exam in Progress</h3>
      <div id="questions-container"></div>
      <button onclick="submitExam()">Submit Assessment</button>
    </div>

    <div id="result-section" class="hidden">
      <h3>Assessment Result</h3>
      <p id="score-display"></p>
      <button onclick="location.reload()">Back to Tests</button>
    </div>
  </div>

  <script>
    const API_BASE = 'https://your-backend-url.onrender.com'; // Change to relative or your Render URL if needed
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    let currentTestId = null;
    let warningsCount = 0;

    // Fisher-Yates shuffle array helper
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Detect tab/window switch
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && currentTestId) {
        warningsCount++;
        document.getElementById('warning-banner').style.display = 'block';
        setTimeout(() => document.getElementById('warning-banner').style.display = 'none', 4000);
      }
    });

    async function loadTests() {
      try {
        const res = await fetch('/api/student/tests', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const tests = await res.json();
        const listDiv = document.getElementById('tests-list');
        listDiv.innerHTML = tests.map(t => `
          <div class="test-card">
            <div>
              <strong>${t.title}</strong> (${t.duration_mins} mins)
              <br><small>State: ${t.test_state}</small>
            </div>
            <div>
              ${t.is_completed > 0 ? `<span>Score: ${t.score}</span>` : (t.test_state === 'ACTIVE' ? `<button onclick="startTest(${t.id}, '${t.title}')">Start Test</button>` : '<span>Locked</span>')}
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('tests-list').innerText = 'Failed to load assessments.';
      }
    }

    async function startTest(testId, title) {
      currentTestId = testId;
      document.getElementById('tests-section').classList.add('hidden');
      document.getElementById('exam-section').classList.remove('hidden');
      document.getElementById('exam-title').innerText = title;

      const res = await fetch(`/api/tests/${testId}/questions`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const questions = await res.json();

      const container = document.getElementById('questions-container');
      container.innerHTML = questions.map((q, idx) => {
        // Shuffle the 4 options visually per attempt
        const options = shuffleArray([
          { label: 'A', text: q.option_a },
          { label: 'B', text: q.option_b },
          { label: 'C', text: q.option_c },
          { label: 'D', text: q.option_d }
        ]);

        const optsHtml = options.map(opt => `
          <label>
            <input type="radio" name="q_${q.id}" value="${opt.label}">
            <strong>${opt.label}:</strong> ${opt.text}
          </label>
        `).join('');

        return `
          <div class="question-block">
            <p><strong>Q${idx + 1}.</strong> ${q.question_text}</p>
            ${optsHtml}
          </div>
        `;
      }).join('');
    }

    async function submitExam() {
      const answers = {};
      const container = document.getElementById('questions-container');
      const inputs = container.querySelectorAll('input[type="radio"]:checked');
      
      inputs.forEach(input => {
        const qId = input.name.replace('q_', '');
        answers[qId] = input.value;
      });

      const res = await fetch('/api/results', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          test_id: currentTestId,
          answers: answers,
          warnings_count: warningsCount
        })
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('exam-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('score-display').innerText = `You scored ${data.score} out of ${data.total_marks}!`;
      } else {
        alert(data.error || 'Submission failed.');
      }
    }

    loadTests();
  </script>
</body>
</html>
